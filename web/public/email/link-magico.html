<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Paredão Play</title></head>
<body style="margin:0;padding:0;background:#0B0B0F;font-family:Arial,Helvetica,sans-serif;color:#F5F5F5">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B0B0F;padding:32px 16px">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#16161D;border-radius:20px;padding:36px 32px;border:1px solid #26262F">
<tr><td>
<img src="{{ .SiteURL }}/email/logo.png" width="237" height="60" alt="Paredão Play" style="display:block;margin:0 0 28px;border:0">
<h1 style="margin:0 0 14px;font-size:26px;line-height:1.2;color:#FFFFFF">Seu link de acesso</h1>
<p style="margin:0 0 28px;font-size:16px;line-height:1.55;color:#B4B4C0">Toque no botão para entrar na sua conta do Paredão Play sem senha. O link vale por 1 hora e só funciona uma vez.</p>
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:999px;background:#FF2D55">
<a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/" style="display:inline-block;padding:15px 30px;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:999px">Entrar no Paredão Play</a>
</td></tr></table>
<p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#B4B4C0">Se você não pediu este acesso, ignore este e-mail.</p>
</td></tr></table>
<p style="margin:20px 0 0;font-size:12px;color:#B4B4C0">Paredão Play. Sua música, sem limites.</p>
</td></tr></table>
</body></html>
